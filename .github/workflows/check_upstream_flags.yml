name: Check Upstream Flag Icons Updates

# Runs quarterly to detect new releases of lipis/flag-icons.
# When a new release is found, the iso3166-1-flags folder is synced and a PR is opened.
# A new PR is created on every run (branch is suffixed with the run number), even if a
# PR for the same release already exists. No PR is opened when the sync produces no changes.
on:
  schedule:
    - cron: '0 0 1 */3 *'  # 00:00 UTC on the 1st of every third month
  workflow_dispatch:        # allow manual trigger from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-sync:
    name: Check and sync lipis/flag-icons
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      # -------------------------------------------------------
      # 1. Fetch the latest release tag from lipis/flag-icons
      # -------------------------------------------------------
      - name: Get latest lipis/flag-icons release
        id: get_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh api repos/lipis/flag-icons/releases/latest --jq '.tag_name')
          RELEASE_URL=$(gh api repos/lipis/flag-icons/releases/latest --jq '.html_url')
          RELEASE_DATE=$(gh api repos/lipis/flag-icons/releases/latest --jq '.published_at' | cut -c1-10)
          echo "latest_tag=$LATEST_TAG"     >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL"   >> "$GITHUB_OUTPUT"
          echo "release_date=$RELEASE_DATE" >> "$GITHUB_OUTPUT"
          echo "Latest lipis/flag-icons release: $LATEST_TAG ($RELEASE_DATE)"

      # -------------------------------------------------------
      # 2. Log any existing PRs for this release (informational
      #    only — a new PR is created on every run regardless).
      # -------------------------------------------------------
      - name: Check if this release was already processed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_TAG: ${{ steps.get_release.outputs.latest_tag }}
        run: |
          EXISTING=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --search "head:upstream/lipis-flag-icons-${LATEST_TAG}" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Release $LATEST_TAG was already processed (PR #$EXISTING) — creating a new PR anyway."
          else
            echo "No existing PR for $LATEST_TAG."
          fi

      # -------------------------------------------------------
      # 3. Download the release tarball and sync iso3166-1-flags
      # -------------------------------------------------------
      - name: Download and sync flags
        env:
          LATEST_TAG: ${{ steps.get_release.outputs.latest_tag }}
        run: |
          pip install iso3166
          python3 - <<'PYEOF'
          import os, tarfile, urllib.request, shutil, json, re
          import iso3166

          latest_tag = os.environ["LATEST_TAG"]
          tarball_url = (
              f"https://github.com/lipis/flag-icons/archive/refs/tags/{latest_tag}.tar.gz"
          )
          target_dir = "iso3166-1-flags"

          print(f"Downloading {tarball_url} ...")
          urllib.request.urlretrieve(tarball_url, "flag-icons.tar.gz")

          print("Extracting archive ...")
          with tarfile.open("flag-icons.tar.gz", "r:gz") as tar:
              #the "data" filter rejects absolute paths, ".." traversal, links pointing outside the
              #destination and special files, so a malicious or compromised upstream release can't
              #write outside flag-icons-tmp/ in a runner that holds contents/pull-requests write access
              try:
                  tar.extractall("flag-icons-tmp", filter="data")
              except TypeError:
                  #the filter argument was added in Python 3.12 (and backported to 3.9.17+/3.10.12+/3.11.4+),
                  #fall back to validating each member by hand on older interpreters
                  destination = os.path.abspath("flag-icons-tmp")
                  for member in tar.getmembers():
                      if not member.isfile() and not member.isdir():
                          raise RuntimeError(f"Refusing to extract non-regular archive member: {member.name}")
                      target = os.path.abspath(os.path.join(destination, member.name))
                      if target != destination and not target.startswith(destination + os.sep):
                          raise RuntimeError(f"Refusing to extract archive member outside destination: {member.name}")
                  tar.extractall("flag-icons-tmp")

          # Locate the extracted root directory (e.g. flag-icons-7.5.0/)
          extracted_dir = next(
              (
                  os.path.join("flag-icons-tmp", d)
                  for d in os.listdir("flag-icons-tmp")
                  if d.startswith("flag-icons-")
              ),
              None,
          )
          if not extracted_dir:
              raise RuntimeError("Could not locate extracted flag-icons directory")

          source_dir = os.path.join(extracted_dir, "flags", "4x3")
          if not os.path.isdir(source_dir):
              raise RuntimeError(f"Expected flags/4x3/ not found in archive: {source_dir}")

          current_flags  = {f for f in os.listdir(target_dir)  if f.endswith(".svg")}
          upstream_flags = {f for f in os.listdir(source_dir) if f.endswith(".svg")}

          official_codes = {code.lower() for code in iso3166.countries_by_alpha2}

          added, updated, removed, skipped = [], [], [], []

          # Flags already in the repo whose code isn't an official ISO 3166-1 alpha-2 code
          # (the curated reserved-code flags: ac, cp, eu, uk, un, ...) are never overwritten
          # or deleted by the sync - several aren't in upstream at all, and those that are
          # (cp, dg, eu, ic, un) are maintained here rather than mirrored.
          protected = {f for f in current_flags if os.path.splitext(f)[0].lower() not in official_codes}

          # Add new flags / overwrite changed flags.
          # A *new* upstream flag is only added if its filename is an official ISO 3166-1
          # alpha-2 code — upstream also ships non-official flags (arab, es-ct, eu, un,
          # gb-sct, ...) which do not belong in this repo.
          for fname in upstream_flags:
              src = os.path.join(source_dir, fname)
              dst = os.path.join(target_dir, fname)
              if fname in protected:
                  continue
              if fname not in current_flags:
                  if os.path.splitext(fname)[0].lower() not in official_codes:
                      skipped.append(fname)
                      continue
                  shutil.copy2(src, dst)
                  added.append(fname)
              else:
                  with open(src, "rb") as fh: new_bytes = fh.read()
                  with open(dst, "rb") as fh: old_bytes = fh.read()
                  if new_bytes != old_bytes:
                      shutil.copy2(src, dst)
                      updated.append(fname)

          # Remove flags that no longer exist upstream
          for fname in current_flags - upstream_flags - protected:
              os.remove(os.path.join(target_dir, fname))
              removed.append(fname)

          # Patch the unit tests in this same PR so they recognise the synced dataset:
          # any synced flag whose code isn't an official ISO 3166-1 alpha-2 code
          # (eu, un, gb-sct, ...) is an "exception flag" the tests must allow for.
          synced_codes = {
              os.path.splitext(f)[0].lower()
              for f in os.listdir(target_dir) if f.endswith(".svg")
          }
          exception_flags = sorted(synced_codes - official_codes)

          tests_updated = []

          # Only patch the tests when the flag folder actually changed, otherwise the regex
          # rewrite alone produces a diff and a PR is opened with no flag changes in it
          exception_flags_changed = bool(added or updated or removed)

          # 1. Rewrite the EXCEPTION_FLAGS set literal in tests/test_iso3166_1_flags.py
          flags_test_path = os.path.join("tests", "test_iso3166_1_flags.py")
          with open(flags_test_path) as fh:
              src = fh.read()
          set_literal = "{\n        " + ", ".join(f'"{c}"' for c in exception_flags) + "\n    }"
          new_src, n = re.subn(r"EXCEPTION_FLAGS = \{[^}]*\}", "EXCEPTION_FLAGS = " + set_literal, src, count=1)
          if n != 1:
              raise RuntimeError(f"Could not locate EXCEPTION_FLAGS set in {flags_test_path}")
          if exception_flags_changed and new_src != src:
              with open(flags_test_path, "w") as fh:
                  fh.write(new_src)
              tests_updated.append(flags_test_path)

          # 2. Rewrite the expected ISO 3166-1 total in tests/test_flag_metadata.py —
          # iso3166_1_total counts every file in the folder, so the expected total is
          # the official codes plus the exception flags now present.
          metadata_test_path = os.path.join("tests", "test_flag_metadata.py")
          with open(metadata_test_path) as fh:
              src = fh.read()
          expected_total_line = (
              f"expected_iso3166_1_total = len(iso3166.countries_by_alpha2) + {len(exception_flags)}"
              f"  #official codes + {len(exception_flags)} non-official exception flags from upstream"
          )
          new_src, n = re.subn(r"expected_iso3166_1_total = len\(iso3166\.countries_by_alpha2\)[^\n]*", expected_total_line, src, count=1)
          if n != 1:
              raise RuntimeError(f"Could not locate expected_iso3166_1_total in {metadata_test_path}")
          if exception_flags_changed and new_src != src:
              with open(metadata_test_path, "w") as fh:
                  fh.write(new_src)
              tests_updated.append(metadata_test_path)

          if tests_updated:
              print(f"Patched unit tests for {len(exception_flags)} exception flags: {exception_flags}")
              print("  Updated:", tests_updated)

          summary = {
              "added":   sorted(added),
              "updated": sorted(updated),
              "removed": sorted(removed),
              "skipped": sorted(skipped),
              "exception_flags": exception_flags,
              "tests_updated":   tests_updated,
          }
          print(
              f"Sync complete — "
              f"added: {len(added)}, updated: {len(updated)}, removed: {len(removed)}"
          )
          if added:   print("  Added  :", added)
          if updated: print("  Updated:", updated)
          if removed: print("  Removed:", removed)
          if skipped: print(f"  Skipped {len(skipped)} new non-official flag(s):", sorted(skipped))

          with open("flag_sync_summary.json", "w") as fh:
              json.dump(summary, fh, indent=2)

          # Clean up download artefacts
          os.remove("flag-icons.tar.gz")
          shutil.rmtree("flag-icons-tmp")
          PYEOF

      # regenerate the derived CSS, README and metadata files so the PR passes the
      # update_everything --check step in build_test.yml
      - name: Regenerate CSS, README and metadata files
        run: |
          pip install -r scripts/requirements.txt
          python -m scripts.update_everything

      # PRs opened with GITHUB_TOKEN don't trigger build_test.yml, so the synced upstream SVGs are checked
      # here - an unsafe flag (script, event handlers, remote references) fails the run before any PR is opened
      - name: Check SVG safety and ISO 3166-2 filenames
        run: python -m scripts.validate_flags

      # -------------------------------------------------------
      # 4. Build the pull-request body from the sync summary
      # -------------------------------------------------------
      # release values come from upstream, so they're passed via env rather than interpolated
      # into the script as expressions - a crafted tag name would otherwise be executed by the shell
      - name: Build PR body
        env:
          LATEST_TAG: ${{ steps.get_release.outputs.latest_tag }}
          RELEASE_URL: ${{ steps.get_release.outputs.release_url }}
          RELEASE_DATE: ${{ steps.get_release.outputs.release_date }}
        run: |
          ADDED_COUNT=0; UPDATED_COUNT=0; REMOVED_COUNT=0; SKIPPED_COUNT=0
          ADDED_LIST="None"; UPDATED_LIST="None"; REMOVED_LIST="None"; SKIPPED_LIST="None"
          EXCEPTION_NOTE=""

          if [ -f flag_sync_summary.json ]; then
            ADDED_COUNT=$(python3   -c "import json; d=json.load(open('flag_sync_summary.json')); print(len(d['added']))")
            UPDATED_COUNT=$(python3 -c "import json; d=json.load(open('flag_sync_summary.json')); print(len(d['updated']))")
            REMOVED_COUNT=$(python3 -c "import json; d=json.load(open('flag_sync_summary.json')); print(len(d['removed']))")
            SKIPPED_COUNT=$(python3 -c "import json; d=json.load(open('flag_sync_summary.json')); print(len(d['skipped']))")

            ADDED_LIST=$(python3 -c "
          import json
          d = json.load(open('flag_sync_summary.json'))
          items = d['added']
          print(', '.join(items[:25]) + (' …' if len(items) > 25 else '') if items else 'None')
          ")
            UPDATED_LIST=$(python3 -c "
          import json
          d = json.load(open('flag_sync_summary.json'))
          items = d['updated']
          print(', '.join(items[:25]) + (' …' if len(items) > 25 else '') if items else 'None')
          ")
            REMOVED_LIST=$(python3 -c "
          import json
          d = json.load(open('flag_sync_summary.json'))
          items = d['removed']
          print(', '.join(items[:25]) + (' …' if len(items) > 25 else '') if items else 'None')
          ")
            SKIPPED_LIST=$(python3 -c "
          import json
          d = json.load(open('flag_sync_summary.json'))
          items = d['skipped']
          print(', '.join(items[:25]) + (' …' if len(items) > 25 else '') if items else 'None')
          ")
            EXCEPTION_NOTE=$(python3 -c "
          import json
          d = json.load(open('flag_sync_summary.json'))
          tests, flags = d.get('tests_updated', []), d.get('exception_flags', [])
          print('Unit tests (' + ', '.join('\`' + t + '\`' for t in tests) + ') were updated in this PR to account for the ' + str(len(flags)) + ' non-official exception flags in the synced dataset: ' + ', '.join(flags) + '.' if tests else '')
          ")
          fi

          # Write body to a file to avoid shell-escaping issues
          # written outside the workspace so it isn't committed into the PR
          cat > "$RUNNER_TEMP/pr_body.md" << MDEOF
          ## Upstream Flag Icons Sync — ${LATEST_TAG}

          A new release of [**lipis/flag-icons**](${RELEASE_URL}) was published on ${RELEASE_DATE}.

          This PR syncs the \`iso3166-1-flags\` folder with the upstream \`flags/4x3/\` directory from that release.

          ### Changes to \`iso3166-1-flags/\`

          | | Count | Flags |
          |---|---|---|
          | ✅ Added   | $ADDED_COUNT   | $ADDED_LIST |
          | 🔄 Updated | $UPDATED_COUNT | $UPDATED_LIST |
          | ❌ Removed | $REMOVED_COUNT | $REMOVED_LIST |
          | ⏭️ Skipped (not official ISO 3166-1) | $SKIPPED_COUNT | $SKIPPED_LIST |

          Skipped files are new upstream flags whose filename is not an official ISO 3166-1 alpha-2 code (e.g. \`arab.svg\`, \`es-ct.svg\`) — they are deliberately **not** added to this repo.

          $EXCEPTION_NOTE

          ### Review checklist
          - [ ] Spot-check changed SVGs against the [upstream release](${RELEASE_URL})
          - [ ] Confirm no custom / curated flags were accidentally overwritten
          - [ ] Sanity-check the regenerated CSS, README and \`iso3166-flags-metadata/\` files in the diff
          - [ ] Run the full test suite (\`python -m unittest discover tests -v\`)

          ---
          *Automatically created by the [check-upstream-flags](.github/workflows/check_upstream_flags.yml) workflow.*
          MDEOF

          # Remove the ephemeral summary so it is not committed
          rm -f flag_sync_summary.json

      # -------------------------------------------------------
      # 5. Open a pull request with all changed SVG files
      # -------------------------------------------------------
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # run_number suffix keeps the branch unique so each run opens a new PR
          branch: upstream/lipis-flag-icons-${{ steps.get_release.outputs.latest_tag }}-run${{ github.run_number }}
          commit-message: "chore: sync iso3166-1-flags from lipis/flag-icons ${{ steps.get_release.outputs.latest_tag }}"
          title: "[Upstream] New lipis/flag-icons release: ${{ steps.get_release.outputs.latest_tag }}"
          body-path: ${{ runner.temp }}/pr_body.md
          labels: |
            upstream-sync
            iso3166-1
          delete-branch: true
