name: Building and Testing

on:
  # triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ main ]
    paths-ignore: 
      - '**/*.md'
      - '**/*.yml'
      - 'docs/**/*'
      - LICENSE
      - .gitignore
  pull_request:
    branches: [ main ]

  #allow for workflow to be manually initiated from the Actions tab
  workflow_dispatch:

jobs:
  #build and test iso3166-flags
  build_test:
    name: Building and testing
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
            # os: [ubuntu-latest, windows-latest] #testing on multiple OS's, macos-latest
            os: [ubuntu-latest]
            python-version: ["3.10", "3.11", "3.12"]   #testing on multiple python versions
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}
    
    #install all required modules and dependencies for scripts and tests using pip and setup.py installation
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip3 install pytest pytest-cov bandit safety
        if [ -f tests/requirements.txt ]; then pip install -r tests/requirements.txt; fi

    #unit tests using unittest framework
    - name: Running unit tests
      run: |
        echo "Testing using unittest..."
        python -m unittest discover tests -v

    #validate all SVG files are well-formed XML
    - name: Validate SVG files
      run: |
        python -c "
        from lxml import etree
        import os, sys
        errors = []
        for root, _, files in os.walk('iso3166-2-flags'):
            for f in files:
                if f.endswith('.svg'):
                    path = os.path.join(root, f)
                    try:
                        etree.parse(path)
                    except Exception as e:
                        errors.append(f'{f}: {e}')
        for root, _, files in os.walk('iso3166-1-flags'):
            for f in files:
                if f.endswith('.svg'):
                    path = os.path.join(root, f)
                    try:
                        etree.parse(path)
                    except Exception as e:
                        errors.append(f'{f}: {e}')
        if errors:
            print('SVG validation errors (first 10):', errors[:10])
            sys.exit(1)
        print(f'All SVGs valid.')
        "

    #reject SVGs that would run script or fetch remote resources once inlined (e.g via the sprite), and ISO 3166-2
    #flags that aren't named after a real subdivision code of the country sub-folder they sit in
    - name: Check SVG safety and ISO 3166-2 filenames
      run: python -m scripts.validate_flags

    #verify the README Quick Stats table row matches the metadata JSON - compares the actual table cells
    #rather than searching for each number anywhere in the README, which could match by coincidence
    - name: Verify README Quick Stats
      run: |
        python -c "
        import json, re, sys
        with open('iso3166-flags-metadata/iso3166_flags_metadata.json') as f:
            meta = json.load(f)
        with open('README.md') as f:
            readme = f.read()
        section = readme.split('## Quick Stats', 1)[1]
        row = [line for line in section.splitlines() if re.match(r'^\|\s*[\d,]+\s*\|', line)][0]
        cells = [c.strip().replace(',', '') for c in row.strip('|').split('|')]
        expected = [meta['total'], meta['iso3166_1_total'], meta['iso3166_2_total'], meta['iso3166_3_total'], meta['svg'], meta['png'], meta['jpg/jpeg'], meta['other']]
        stale = [f'column {i + 1}: README has {c}, metadata has {e}' for i, (c, e) in enumerate(zip(cells, expected)) if c != str(e)]
        if stale:
            print('README Quick Stats are stale:', stale)
            sys.exit(1)
        print('README stats are up to date.')
        "

    #verify the generated CSS, per-country README and metadata files are in sync with the flag directories -
    #fails if flags were added/changed without regenerating the derived files via scripts/update_everything.py
    - name: Check generated CSS/README/metadata files are up to date
      run: python -m scripts.update_everything --check

  #run various vulnerability, security and package checks
  security_check:
    name: Bandit and package safety check 
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
            # os: [ubuntu-latest, windows-latest] #testing on multiple OS's, macos-latest
            os: [ubuntu-latest]
            python-version: ["3.11"]   #testing on multiple python versions
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}

    #create artifacts dir
    - name: Artifacts mkdir
      run: mkdir artifacts

    #package vulnerability check of the pinned requirements using pip-audit (no account/API key needed,
    #unlike safety v3) - fails the job on any known vulnerability
    - name: Package vulnerability check
      run: |
        pip install pip-audit
        set -o pipefail
        pip-audit -r scripts/requirements.txt -r tests/requirements.txt --progress-spinner off | tee artifacts/package_safety_output.txt

    #run Bandit security check scoped to production code only, failing on medium+ severity and confidence findings
    - name: Bandit
      run: |
        pip install bandit
        set -o pipefail
        python -m bandit -r scripts/ --severity-level medium --confidence-level medium | tee artifacts/bandit_output.txt

    #upload test artifacts to workflow, even when a check above failed
    - name: Upload Test Artifacts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: test_artifacts
        path: |
          artifacts/package_safety_output.txt
          artifacts/bandit_output.txt
  
  #linter check on repo
  linter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]   #testing on multiple python versions

    steps:
      #checkout repo
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # install all required modules and dependencies using pip installation
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
      
      #create temp artifacts repo
      - name: Artifacts mkdir
        run: mkdir flake8_artifacts

      #linting with flake8
      - name: Lint with flake8
        run: |
          echo "Testing using flake8..."
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics > flake8_artifacts/flake8_output.txt
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics >> flake8_artifacts/flake8_output.txt
        continue-on-error: true
      
      #upload artifacts to repo
      - name: Upload flake8 Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flake8_artifact
          path: flake8_artifacts/flake8_output.txt
          if-no-files-found: error 

  #code coverage check
  code_coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      #checkout repo
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # install all required coverage test modules and dependencies 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f tests/requirements.txt ]; then pip install -r tests/requirements.txt; fi
          pip3 install pytest pytest-cov

      #generate codecov report using pytest
      - name: Generate Coverage report
        run: pytest tests --cov=. --cov-branch --cov-report=xml:coverage.xml

      #upload to Code Coverage, only if matrix python version is 3.11
      - name: Upload Coverage Report to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: coverage.xml
          flags: iso3166_flags_workflow
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
        # env: 
        #   CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}